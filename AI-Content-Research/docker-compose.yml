services:
  # ── 1. FastAPI Backend + Playwright ───────────────────────────────────────
  # NOTE: Ollama runs natively on Windows (not in Docker) for GPU access.
  # The backend connects to it via host.docker.internal:11434
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: research_backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
      - OLLAMA_NUM_GPU_LAYERS=-1
      - OLLAMA_TIMEOUT_SECONDS=300
      - LLM_EXTRACTION_MODEL=qwen3:14b
      - LLM_REASONING_MODEL=deepseek-r1:8b
      - BROWSER_HEADLESS=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./output:/app/output
    restart: unless-stopped

  # ── 2. Nginx + React Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: research_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
